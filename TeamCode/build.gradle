// Sloth hot reload (https://github.com/Dairy-Foundation/Sloth): the Load plugin adds the
// deploySloth / removeSlothRemote Gradle tasks. Keep this version equal to the Sloth library below.
buildscript {
    repositories {
        mavenCentral()
        google()
        maven {
            url "https://repo.dairy.foundation/releases"
        }
    }
    dependencies {
        classpath "dev.frozenmilk:Load:0.3.2"
    }
}

apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// ---------------------------------------------------------------------------------------------
// Pedro Pathing + Panels switch. While true, the build includes the full Pedro 3 suite and Panels,
// and compiles everything under src/pedro/java (Constants, tuners, Pedro TeleOp). Set to false
// to build without any of it. See src/pedro/README.md for the setup checklist.
// ---------------------------------------------------------------------------------------------
def usePedro = true

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'
apply plugin: 'dev.frozenmilk.sinister.sloth.load'

repositories {
    // Dairy releases: Sloth (and Sinister, which Pedro's tuning also uses).
    maven {
        url = "https://repo.dairy.foundation/releases"
    }
}

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }

    if (usePedro) {
        // The Pedro Quickstart builds against SDK 34 (the FTC default here is 30).
        compileSdk 34
        sourceSets {
            main {
                java.srcDirs += 'src/pedro/java'
            }
        }
    }
}

if (usePedro) {
    repositories {
        // Panels.
        maven { url = 'https://mymaven.bylazar.com/releases' }
    }
}

dependencies {
    implementation project(':FtcRobotController')
    implementation "dev.frozenmilk.sinister:Sloth:0.3.2"   // keep equal to the Load plugin above

    if (usePedro) {
        // Latest releases as of 2026-11-19.
        // Pedro 3 (Maven Central). revhub pulls in com.pedropathing:core at the same version.
        // Do NOT add com.pedropathing:ftc: that is the old Pedro 2 library and conflicts with core 3.
        implementation 'com.pedropathing:revhub:3.0.2'      // drivetrains + localizers
        implementation 'com.pedropathing:tuning:1.0.3'      // auto-tuning web UI (port 10158)
        implementation 'com.pedropathing:ivy:1.0.0'         // command scheduler
        implementation 'com.pedropathing:telemetry:1.0.0'   // selectable on-robot menus

        // Panels: every plugin (telemetry, graph, field, configurables, gamepad, camera, ...).
        // Dashboard at http://192.168.43.1:8001 when connected to the robot's Wi-Fi.
        implementation 'com.bylazar:fullpanels:1.0.20'
    }
}
