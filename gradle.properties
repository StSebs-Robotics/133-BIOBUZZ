# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# We no longer need to auto-convert third-party libraries to use AndroidX, which slowed down the build
android.enableJetifier=false

android.nonTransitiveRClass=false

# ---- Build speed ----
# Give the Gradle daemon enough heap that it isn't constantly garbage collecting (was 1 GB).
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Build FtcRobotController and TeamCode in parallel where possible.
org.gradle.parallel=true

# Reuse task outputs from earlier builds (e.g. after a clean or switching branches).
org.gradle.caching=true

# Skip re-running the build scripts when nothing in them changed.
# If a plugin ever breaks with this, set it to false.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
